<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1012" />
      <stop offset="60%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <radialGradient id="redAura" cx="50%" cy="50%" r="45%">
      <stop offset="70%" stop-color="#e50914" stop-opacity="0" />
      <stop offset="90%" stop-color="#e50914" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0.8" />
    </radialGradient>
    <linearGradient id="chromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="53%" stop-color="#334155" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e3b" />
      <stop offset="100%" stop-color="#c4000d" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Glow & Outer Teeth Gear Silhouette (24 Teeth) -->
  <g id="gearOuter" filter="url(#shadow)">
    <!-- Outer Gear Wheel Base -->
    <path d="
      M 250 15 
      L 262 16 L 265 32 L 285 36 L 298 24 L 308 30 L 306 47 L 325 55 L 341 47 L 350 56 L 343 72 L 360 84 L 379 79 L 386 89 L 375 104 L 389 119 L 409 119 L 413 131 L 398 143 L 408 160 L 427 164 L 428 177 L 410 186 L 415 204 L 433 213 L 431 226 L 410 231 L 411 250 L 431 255 L 429 268 L 410 274 L 414 292 L 432 301 L 428 314 L 409 318 L 405 336 L 421 349 L 414 361 L 395 361 L 386 377 L 399 393 L 390 403 L 372 399 L 359 413 L 368 430 L 357 438 L 341 429 L 325 440 L 329 458 L 317 465 L 304 452 L 286 460 L 285 478 L 272 482 L 262 466 L 243 470 L 238 488 L 225 488 L 222 470 L 203 465 L 194 481 L 182 478 L 182 460 L 164 452 L 152 466 L 141 459 L 144 441 L 128 430 L 112 439 L 102 431 L 111 414 L 97 400 L 79 404 L 71 394 L 84 378 L 74 362 L 56 362 L 49 350 L 65 337 L 61 319 L 42 315 L 38 302 L 56 293 L 59 275 L 40 269 L 39 256 L 59 251 L 59 232 L 40 227 L 41 214 L 59 205 L 63 187 L 45 178 L 47 165 L 65 161 L 75 144 L 60 132 L 65 120 L 84 120 L 98 105 L 87 90 L 95 80 L 113 85 L 130 73 L 123 57 L 133 48 L 149 56 L 168 48 L 166 31 L 177 25 L 189 37 L 209 33 L 212 17 L 225 14 L 235 29 Z" 
      fill="url(#chromeOuter)" stroke="#1e293b" stroke-width="3" />
    
    <!-- Outer Bezel Ring with metallic sheen -->
    <circle cx="250" cy="250" r="210" fill="#0b0f14" stroke="url(#chromeOuter)" stroke-width="8" />
    <circle cx="250" cy="250" r="202" fill="none" stroke="#e50914" stroke-width="4" filter="url(#glow)" opacity="0.9" />
    <circle cx="250" cy="250" r="198" fill="url(#bgGlow)" />
  </g>

  <!-- Top Half: 3D Dual-Clutch Gearbox Cutaway Representation -->
  <g id="gearboxCutaway" transform="translate(110, 68)">
    <!-- Gearbox Outer Shell -->
    <path d="M 20 75 Q 70 30 140 30 Q 210 30 260 75 L 255 105 L 25 105 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Transmission Gear Stacks & Bearings -->
    <g fill="#94a3b8" stroke="#334155" stroke-width="1.5">
      <!-- Left Differential / Input Shaft Section -->
      <rect x="35" y="45" width="22" height="55" rx="3" fill="url(#chromeOuter)" />
      <line x1="39" y1="48" x2="39" y2="97" stroke="#0f172a" stroke-width="2" />
      <line x1="47" y1="48" x2="47" y2="97" stroke="#0f172a" stroke-width="2" />
      <line x1="53" y1="48" x2="53" y2="97" stroke="#0f172a" stroke-width="2" />

      <!-- Wet/Dry Clutch Pack Chamber with Red Pinstripe -->
      <rect x="65" y="38" width="42" height="66" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
      <rect x="70" y="42" width="6" height="58" fill="#e50914" opacity="0.8" />
      <rect x="79" y="42" width="6" height="58" fill="url(#chromeOuter)" />
      <rect x="88" y="42" width="6" height="58" fill="#e50914" opacity="0.8" />
      <rect x="97" y="42" width="6" height="58" fill="url(#chromeOuter)" />

      <!-- Center Gear Splines & Synchronizer Rings -->
      <rect x="114" y="42" width="38" height="60" rx="3" fill="url(#chromeOuter)" />
      <line x1="119" y1="45" x2="119" y2="99" stroke="#334155" stroke-width="2" />
      <line x1="125" y1="45" x2="125" y2="99" stroke="#334155" stroke-width="2" />
      <line x1="131" y1="45" x2="131" y2="99" stroke="#334155" stroke-width="2" />
      <line x1="137" y1="45" x2="137" y2="99" stroke="#334155" stroke-width="2" />
      <line x1="145" y1="45" x2="145" y2="99" stroke="#334155" stroke-width="2" />

      <!-- Right Output Pinion Gear & Casing -->
      <rect x="158" y="46" width="35" height="54" rx="2" fill="url(#chromeOuter)" />
      <rect x="198" y="52" width="28" height="46" rx="2" fill="#64748b" />
      <rect x="230" y="58" width="18" height="38" rx="2" fill="url(#chromeOuter)" />

      <!-- Red Accent Precision Ring -->
      <circle cx="132" cy="72" r="18" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="4,2" />
      <circle cx="86" cy="71" r="24" fill="none" stroke="#e50914" stroke-width="1.5" />
    </g>
  </g>

  <!-- Red Racing Diagonal Slashes (Left of DSG) -->
  <g id="racingSlashes" transform="translate(42, 192)">
    <polygon points="12,0 0,76 18,76 30,0" fill="url(#redGrad)" filter="url(#glow)" />
    <polygon points="34,0 22,76 40,76 52,0" fill="url(#redGrad)" filter="url(#glow)" />
  </g>

  <!-- Big Metallic Chrome "DSG" -->
  <text x="100" y="260" font-family="'Plus Jakarta Sans', 'Montserrat', 'Impact', sans-serif" font-weight="900" font-style="italic" font-size="94" letter-spacing="-3" fill="url(#chromeText)" stroke="#090d14" stroke-width="3" filter="url(#shadow)">
    DSG
  </text>

  <!-- GEARBOX (White) + DOCTOR (Red) -->
  <g id="brandSubtitle" transform="translate(250, 305)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Barlow', sans-serif" font-weight="900" font-size="34" letter-spacing="4">
      <tspan fill="#FFFFFF" dx="0">GEARBOX</tspan>
      <tspan fill="#E50914" dx="10" filter="url(#glow)">DOCTOR</tspan>
    </text>
  </g>

  <!-- Tagline: DIAGNOSIS | REPAIR | REBUILD | SERVICING -->
  <g id="serviceTagline" transform="translate(250, 328)" text-anchor="middle">
    <line x1="-190" y1="-8" x2="190" y2="-8" stroke="#334155" stroke-width="1" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#cbd5e1">
      DIAGNOSIS <tspan fill="#e50914"> | </tspan> REPAIR <tspan fill="#e50914"> | </tspan> REBUILD <tspan fill="#e50914"> | </tspan> SERVICING
    </text>
  </g>

  <!-- Lower Section: Pulse Line / Heartbeat Lifeline with Wrench in Gear -->
  <g id="medicalHeartbeat" transform="translate(0, 360)">
    <!-- Red Accent Base Line -->
    <path d="M 75 0 L 175 0 L 188 -18 L 198 16 L 210 -22 L 218 0 L 222 0" fill="none" stroke="#e50914" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 278 0 L 282 0 L 290 -22 L 302 16 L 312 -18 L 325 0 L 425 0" fill="none" stroke="#e50914" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Doctor Mechanical Badge (Center Gear + Wrench) -->
    <g transform="translate(250, 0)">
      <!-- Outer Mini Gear -->
      <circle cx="0" cy="0" r="28" fill="#090d14" stroke="#e50914" stroke-width="2.5" />
      <!-- Silver Cog Teeth -->
      <g fill="url(#chromeOuter)">
        <rect x="-4" y="-32" width="8" height="6" rx="1" />
        <rect x="-4" y="26" width="8" height="6" rx="1" />
        <rect x="-32" y="-4" width="6" height="8" rx="1" />
        <rect x="26" y="-4" width="6" height="8" rx="1" />
        <rect x="-24" y="-24" width="7" height="7" rx="1" transform="rotate(45)" />
        <rect x="18" y="-24" width="7" height="7" rx="1" transform="rotate(45)" />
        <rect x="-24" y="18" width="7" height="7" rx="1" transform="rotate(45)" />
        <rect x="18" y="18" width="7" height="7" rx="1" transform="rotate(45)" />
      </g>
      <!-- Center Circle -->
      <circle cx="0" cy="0" r="19" fill="#141923" stroke="#475569" stroke-width="1.5" />
      <!-- Chrome Mechanical Wrench Icon -->
      <path d="M -7 -7 C -9 -4 -9 1 -6 4 L 7 17 C 8 18 10 18 11 17 C 12 16 12 14 11 13 L -2 0 C 0 -3 0 -7 -3 -9 C -4 -10 -6 -10 -7 -9 L -3 -5 L -5 -3 L -9 -7 C -8 -7 -8 -7 -7 -7 Z" fill="url(#chromeOuter)" transform="rotate(-25) scale(1.15)" stroke="#090d14" stroke-width="0.8" />
    </g>
  </g>

  <!-- Arc Text: KEEPING YOU ON THE ROAD -->
  <path id="curvePath" d="M 105 385 A 175 175 0 0 0 395 385" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14.5" fill="#f8fafc" letter-spacing="5.5">
    <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
      KEEPING YOU ON THE ROAD
    </textPath>
  </text>
</svg>
